version: "3.9"

services:
  app:
    #build: .
    image: ghcr.io/amm-projects/coches-web-docker-app:latest
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - ./coches-web:/app
      - /app/vendor
      - /app/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: coches
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coches
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10


  #phpmyadmin:
   # image: phpmyadmin:latest
